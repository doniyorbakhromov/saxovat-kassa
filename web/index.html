<!DOCTYPE html>
<html lang="uz">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Bar uchun kassa tizimi - stollar, buyurtmalar va to'lovlar">
  <meta name="theme-color" content="#0A0D14">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kassa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Saxovat Kassa</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0A0D14;
      overscroll-behavior: none;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: radial-gradient(circle at 30% 20%, #131826 0%, #0A0D14 60%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
      z-index: 10;
    }
    #boot .mark {
      width: 74px; height: 74px;
      border-radius: 24px;
      background: linear-gradient(135deg, #FFD36B, #F3B21B);
      display: flex; align-items: center; justify-content: center;
      font-size: 34px;
      box-shadow: 0 12px 40px rgba(243,178,27,.28);
      animation: pulse 1.8s ease-in-out infinite;
    }
    #boot .name {
      color: #EDF0F7;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 4px;
    }
    #boot .sub {
      color: #5C667C;
      font-size: 12px;
      letter-spacing: 2px;
      margin-top: -14px;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.94); opacity: .82; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark">&#127864;</div>
    <div class="name">SAXOVAT KASSA</div>
    <div class="sub">yuklanmoqda...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (!b) return;
      b.style.opacity = '0';
      setTimeout(function () { b.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
